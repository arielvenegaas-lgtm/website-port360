<style id="app-css">
/* Xbox 360 blade-inspired dashboard: pale ground, green ribbons, glossy green panels and box-art tiles. */
:root{
  --bg:#e9ede5; --panel:rgba(255,255,255,.74); --panel-solid:#fbfcf9;
  --ink:#1c241a; --ink2:#566351; --line:rgba(40,70,25,.18);
  --green:#6cb41c; --green-hi:#a9e24c; --green-lo:#3d7a0a; --green-text:#356b07;
  --on-green:#0d2102; --shadow:rgba(30,55,18,.30); --ribbon:.16;
  --font:'Fira Sans','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e130e; --panel:rgba(28,38,27,.78); --panel-solid:#192218;
    --ink:#e8f0e2; --ink2:#9aaa93; --line:rgba(170,225,120,.18);
    --green:#7ccc23; --green-hi:#b8f25c; --green-lo:#4a8a0e; --green-text:#a2e456;
    --on-green:#0b1a02; --shadow:rgba(0,0,0,.6); --ribbon:.12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e130e; --panel:rgba(28,38,27,.78); --panel-solid:#192218;
  --ink:#e8f0e2; --ink2:#9aaa93; --line:rgba(170,225,120,.18);
  --green:#7ccc23; --green-hi:#b8f25c; --green-lo:#4a8a0e; --green-text:#a2e456;
  --on-green:#0b1a02; --shadow:rgba(0,0,0,.6); --ribbon:.12; color-scheme:dark;
}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.5;
  padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(48px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  min-height:100vh;
}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bg svg{position:absolute;inset:0;width:100%;height:100%}
.bg path{fill:var(--green);opacity:var(--ribbon)}
.bg path.b{opacity:calc(var(--ribbon) * .6)}
.bg path.c{fill:var(--ink);opacity:.035}
.wrap{max-width:1040px;margin:0 auto;min-width:0}

.skip{position:absolute;left:-9999px;top:8px;z-index:40;padding:10px 16px;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:600}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0;color:inherit;text-decoration:none;border-radius:10px}
.brand:focus-visible{outline:3px solid var(--green);outline-offset:4px}
.orb{position:relative;flex:0 0 auto;width:46px;height:46px;border-radius:50%;
  background:radial-gradient(circle at 35% 28%,#e3ffa8 0,var(--green-hi) 22%,var(--green) 55%,var(--green-lo) 100%);
  box-shadow:0 0 0 2px rgba(255,255,255,.55),0 6px 20px -4px var(--green),inset 0 -6px 10px rgba(0,0,0,.25)}
.orb::after{content:"";position:absolute;inset:11px;border-radius:50%;border:3px solid rgba(255,255,255,.9);border-top-color:transparent;transform:rotate(-35deg)}
.brand b{display:block;font-weight:800;letter-spacing:.16em;font-size:18px;line-height:1.1}
.brand small{display:block;color:var(--ink2);font-size:13px;letter-spacing:.04em}
.top-actions{display:flex;align-items:center;gap:12px}
.clock{font-weight:300;font-size:28px;letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--ink2)}
.icon-btn{appearance:none;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink2);font:600 13px/1 var(--font);cursor:pointer}
.icon-btn:hover{color:var(--ink)}
.icon-btn:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.icon-btn .ico{display:grid;place-items:center;width:18px;height:18px}
.icon-btn svg{width:18px;height:18px;display:block}
.icon-label{letter-spacing:.04em}
@media (max-width:520px){
  .icon-label{display:none}
  .clock{font-size:24px}
}

.blades{display:flex;gap:4px;overflow-x:auto;margin:22px 0 14px;scrollbar-width:none}
.blades::-webkit-scrollbar{display:none}
.blade-tab{appearance:none;border:0;background:none;color:var(--ink2);font:300 28px/1.1 var(--font);letter-spacing:-.01em;
  padding:8px 14px 12px;cursor:pointer;position:relative;white-space:nowrap;border-radius:8px}
.blade-tab[aria-selected="true"]{color:var(--ink);font-weight:600}
.blade-tab[aria-selected="true"]::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:4px;border-radius:2px;
  background:linear-gradient(90deg,var(--green-hi),var(--green));box-shadow:0 0 14px var(--green)}
.blade-tab small{font:600 13px/1 var(--font);margin-left:8px;color:var(--green-text)}
.blade-tab:focus-visible{outline:3px solid var(--green);outline-offset:2px}

.panel{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--panel);
  box-shadow:0 14px 34px -14px var(--shadow);overflow:hidden;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.panel + .panel{margin-top:18px}
.panel-head{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;
  background:linear-gradient(180deg,var(--green-hi),var(--green) 55%,var(--green-lo));color:var(--on-green);
  font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.panel-head::after{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.06));pointer-events:none}
.panel-head span{position:relative;z-index:1}

.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 18px 0}
.search{position:relative;flex:1 1 260px;display:flex;align-items:center;min-width:0}
.search-ico{position:absolute;left:13px;display:grid;place-items:center;width:18px;height:18px;color:var(--ink2);pointer-events:none}
.search-ico svg{width:18px;height:18px;display:block}
.search input{width:100%;min-height:44px;font:inherit;color:inherit;background:var(--panel-solid);border:1px solid var(--line);
  border-radius:999px;padding:10px 16px 10px 40px}
.search input:focus-visible{outline:3px solid var(--green);outline-offset:1px}
.sortwrap{display:flex;align-items:center;gap:8px;color:var(--ink2);font:600 12px/1 var(--font);letter-spacing:.08em;text-transform:uppercase}
.sortwrap select{min-height:44px;padding:0 14px;font:600 14px/1 var(--font);color:var(--ink);background:var(--panel-solid);
  border:1px solid var(--line);border-radius:999px;cursor:pointer}
.sortwrap select:focus-visible{outline:3px solid var(--green);outline-offset:1px}
.results-count{margin:12px 18px 0;min-height:1.3em;font-size:13px;color:var(--ink2)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px 18px;padding:18px}
.tile{appearance:none;border:0;background:none;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;gap:10px;min-width:0;border-radius:8px}
.tile:focus-visible{outline:3px solid var(--green);outline-offset:5px}
.tile-case{position:relative;display:block}
.case{position:relative;aspect-ratio:2/3;width:100%;max-width:100%;display:flex;flex-direction:column;border-radius:5px;overflow:hidden;
  background:#111;box-shadow:0 10px 20px -8px var(--shadow),0 0 0 1px rgba(0,0,0,.3)}
.case-band{flex:0 0 11%;min-height:22px;display:flex;align-items:center;justify-content:space-between;padding:0 9px;
  background:linear-gradient(var(--green-hi),var(--green-lo));color:#0b1a02;font:800 10px/1 var(--font);letter-spacing:.16em}
.case-art{position:relative;flex:1;display:flex;align-items:flex-end;padding:12px;overflow:hidden;
  background:linear-gradient(155deg,hsl(var(--h,95) 55% 40%),hsl(calc(var(--h,95) + 40) 60% 15%))}
.case-art::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.3),rgba(255,255,255,0) 42%);pointer-events:none;z-index:1}
.case-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.case-title{position:relative;z-index:2;color:#fff;font:800 21px/1.05 var(--font);text-transform:uppercase;letter-spacing:.01em;
  text-shadow:0 2px 8px rgba(0,0,0,.55);overflow-wrap:anywhere}
.badge{position:absolute;top:8px;left:8px;z-index:3;font:800 10px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;
  padding:5px 8px;border-radius:999px;background:var(--green-hi);color:#0b1a02;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.tile-name{font-weight:600;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tile-meta{font-size:13px;color:var(--ink2);margin-top:-6px}
@media (prefers-reduced-motion: no-preference){
  .case{transition:transform .18s ease,box-shadow .18s ease}
  .sheet-card{animation:rise .22s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
}
@media (hover:hover){
  .tile:hover .case{transform:translateY(-4px);
    box-shadow:0 16px 28px -10px var(--shadow),0 0 0 3px var(--green-hi),0 0 24px var(--green)}
}

.empty{padding:36px 18px;color:var(--ink2);text-align:left;grid-column:1/-1}
.empty b{display:block;color:var(--ink);font-weight:600;font-size:20px;margin-bottom:4px}

.info{display:grid;gap:18px;padding:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.info h3{margin:0 0 6px;font-weight:600;font-size:17px}
.info p,.info ol{margin:0;color:var(--ink2)}
.info ol{padding-left:20px;display:grid;gap:6px}
.info a{color:var(--green-text);font-weight:600}

.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-back{position:absolute;inset:0;background:rgba(8,14,6,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet-card{position:relative;width:100%;max-width:760px;max-height:100%;overflow:auto;border-radius:14px;
  background:var(--panel-solid);border:1px solid var(--line);box-shadow:0 30px 70px -20px rgba(0,0,0,.6);-webkit-overflow-scrolling:touch}
.sheet-body{display:grid;grid-template-columns:minmax(160px,200px) minmax(0,1fr);gap:22px;padding:20px}
.sheet-body .case{max-width:200px}
.sheet-info{min-width:0;padding-right:28px}
.sheet h2{margin:0 0 4px;font-weight:300;font-size:34px;line-height:1.1;letter-spacing:-.01em;overflow-wrap:anywhere}
.origin{margin:0 0 10px;color:var(--ink2);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px;padding:0;list-style:none}
.chips li{font:600 13px/1 var(--font);padding:7px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink2)}
.chips li.g{color:var(--on-green);background:linear-gradient(var(--green-hi),var(--green));border-color:transparent}
.desc{margin:0 0 18px;max-width:58ch;white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.sheet-x{position:absolute;top:10px;right:10px;z-index:3;appearance:none;width:40px;height:40px;border-radius:50%;
  border:1px solid var(--line);background:var(--panel-solid);color:var(--ink);font:300 24px/1 var(--font);cursor:pointer}
.sheet-x:hover{background:var(--panel)}
.sheet-x:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.checks{margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.checks summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--ink2)}
.checks summary:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.checks dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;margin:12px 0 0;font-size:13px}
.checks dt{color:var(--ink2);font-weight:600}
.checks dd{margin:0;min-width:0;overflow-wrap:anywhere}
.checks code,.checks dd{font-family:ui-monospace,Menlo,Consolas,monospace}
.checks code{color:var(--green-text);overflow-wrap:anywhere}

@media (max-width:560px){
  .sheet-body{grid-template-columns:1fr;gap:16px;padding:16px}
  .sheet-body .case{max-width:150px}
  .sheet-info{padding-right:0}
  .sheet h2{font-size:28px;padding-right:24px}
}

.btn{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:7px 22px 7px 8px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel-solid);color:var(--ink);font:600 15px/1 var(--font);cursor:pointer;
  text-decoration:none;white-space:nowrap}
.btn:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.btn-a{background:linear-gradient(var(--green-hi),var(--green) 60%,var(--green-lo));color:var(--on-green);
  border-color:rgba(0,0,0,.22);box-shadow:0 6px 16px -6px var(--green)}
.btn.plain{padding-right:18px}
.pad{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:800 15px/1 var(--font);color:#fff;
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.28),inset 0 2px 3px rgba(255,255,255,.35)}
.pad.a{background:#2b6706}.pad.b{background:#bf3a2b}.pad.x{background:#2a6dc0}.pad.y{background:#b8960b}

.toast{position:fixed;left:50%;transform:translateX(-50%);z-index:30;max-width:calc(100% - 32px);
  bottom:max(16px,env(safe-area-inset-bottom,0px));padding:12px 18px;border-radius:999px;background:var(--ink);
  color:var(--bg);font-weight:600;font-size:14px;text-align:center;box-shadow:0 12px 30px -12px rgba(0,0,0,.6)}

.foot{margin-top:22px;padding:0 4px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 18px;
  color:var(--ink2);font-size:13px}
.foot p{margin:0}
.foot a{color:var(--green-text);font-weight:600}
.foot a:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:4px}

.noscript{max-width:1040px;margin:0 auto;padding:18px;color:var(--ink2)}
.no-scroll{overflow:hidden}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  function parseDate(value) {
    if (!value) return null;
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(value));
    if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    var d = new Date(value);
    return isNaN(d.getTime()) ? null : d;
  }

  function fmtDate(value) {
    var d = parseDate(value);
    return d ? d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '';
  }

  function isNew(g) {
    var d = parseDate(g.added);
    if (!d) return false;
    var days = (Date.now() - d.getTime()) / 864e5;
    return days >= -1 && days <= 30;
  }

  function normalize(value) {
    return String(value || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function absUrl(value) {
    try { return new URL(value, location.href).href; } catch (err) { return value; }
  }

  function fileName(value) {
    try { return decodeURIComponent(String(value).split('/').pop().split('?')[0]); }
    catch (err) { return String(value); }
  }

  function el(tag, attrs) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (key) {
        var value = attrs[key];
        if (value == null || value === false) return;
        if (key === 'class') node.className = value;
        else if (key === 'text') node.textContent = value;
        else if (key === 'html') node.innerHTML = value;
        else if (key === 'dataset') {
          Object.keys(value).forEach(function (k) { node.dataset[k] = value[k]; });
        } else if (key.slice(0, 2) === 'on' && typeof value === 'function') {
          node.addEventListener(key.slice(2).toLowerCase(), value);
        } else {
          node.setAttribute(key, value === true ? '' : value);
        }
      });
    }
    for (var i = 2; i < arguments.length; i += 1) append(node, arguments[i]);
    return node;
  }

  function append(node, kid) {
    if (kid == null || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach(function (k) { append(node, k); }); return; }
    node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }

  function pad(kind, letter) {
    return el('span', { class: 'pad ' + kind, 'aria-hidden': 'true', text: letter });
  }

  function toast(message, ms) {
    if (!toastEl) return;
    clearTimeout(toastTimer);
    toastEl.textContent = message;
    toastEl.hidden = false;
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, ms || 2800);
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }

  function legacyCopy(text) {
    var area = el('textarea', { class: 'sr-only', readonly: true });
    area.value = text;
    document.body.append(area);
    area.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    area.remove();
    return ok;
  }

  function storedTheme() {
    try {
      var value = localStorage.getItem(THEME_KEY);
      return value === 'light' || value === 'dark' ? value : 'auto';
    } catch (err) { return 'auto'; }
  }

  function applyTheme(mode, persist) {
    currentTheme = mode === 'light' || mode === 'dark' ? mode : 'auto';
    if (currentTheme === 'auto') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', currentTheme);
    if (persist) {
      try {
        if (currentTheme === 'auto') localStorage.removeItem(THEME_KEY);
        else localStorage.setItem(THEME_KEY, currentTheme);
      } catch (err) { /* storage may be blocked */ }
    }
    if (themeBtn) renderThemeButton();
  }

  function renderThemeButton() {
    var label = THEME_LABELS[currentTheme];
    themeBtn.textContent = '';
    themeBtn.append(
      el('span', { class: 'ico', 'aria-hidden': 'true', html: ICONS[currentTheme] }),
      el('span', { class: 'icon-label', text: label })
    );
    themeBtn.setAttribute('aria-label', 'Theme: ' + label + '. Change theme');
    themeBtn.title = 'Theme: ' + label;
  }

  function cycleTheme() {
    var order = ['auto', 'light', 'dark'];
    applyTheme(order[(order.indexOf(currentTheme) + 1) % order.length], true);
  }

  function tick() {
    if (!clockEl) return;
    clockEl.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function buildFooter() {
    var meta = el('p', {});
    if (parseDate(library.updated)) {
      meta.append('Updated ', el('time', { datetime: library.updated, text: fmtDate(library.updated) }), ' · ');
    }
    meta.append(el('a', { href: REPO, target: '_blank', rel: 'noopener noreferrer', text: 'GitHub' }));
    return el('footer', { class: 'foot' },
      el('p', { text: 'Unofficial homebrew library. Not affiliated with Microsoft or the original game creators.' }),
      meta);
  }

  function buildShell() {
    var bg = el('div', { class: 'bg', 'aria-hidden': 'true' });
    bg.innerHTML = '<svg viewBox="0 0 800 600" preserveAspectRatio="none"><path d="M0 420 C160 330 280 520 460 440 C620 370 700 250 800 280 L800 600 L0 600 Z"/><path class="b" d="M0 300 C140 210 300 360 470 280 C620 210 720 90 800 110 L800 190 C720 190 640 300 480 370 C300 450 150 300 0 380 Z"/><path class="c" d="M0 520 C200 470 330 590 520 520 C660 470 740 430 800 440 L800 600 L0 600 Z"/></svg>';

    clockEl = el('div', { class: 'clock', 'aria-hidden': 'true' });
    themeBtn = el('button', { class: 'icon-btn', type: 'button', id: 'theme-btn' });
    themeBtn.addEventListener('click', cycleTheme);
    tabsEl = el('nav', { class: 'blades', role: 'tablist', 'aria-label': 'Sections' });
    tabsEl.addEventListener('keydown', onTabKey);
    mainEl = el('main', { id: 'blade', role: 'tabpanel', tabindex: '-1' });
    toastEl = el('div', { class: 'toast', role: 'status', 'aria-live': 'polite', hidden: true });

    var header = el('header', { class: 'top' },
      el('a', { class: 'brand', href: './', 'aria-label': '360 Ports home' },
        el('span', { class: 'orb', 'aria-hidden': 'true' }),
        el('div', {}, el('b', { text: '360 PORTS' }), el('small', { text: 'Xbox 360 homebrew library' }))),
      el('div', { class: 'top-actions' }, clockEl, themeBtn));

    var wrap = el('div', { class: 'wrap' }, header, tabsEl, mainEl, buildFooter());
    app.append(bg, wrap, toastEl);

    applyTheme(storedTheme(), false);
    renderTabs();
    renderBlade();
    tick();
    setInterval(tick, 30000);
    syncHash();
    document.addEventListener('keydown', onGlobalKey);
    window.addEventListener('hashchange', syncHash);
  }

  function renderTabs() {
    tabsEl.textContent = '';
    var defs = [
      { id: 'games', label: 'games', count: games.length },
      { id: 'info', label: 'info' }
    ];
    defs.forEach(function (def) {
      var selected = activeTab === def.id;
      var btn = el('button', {
        class: 'blade-tab',
        type: 'button',
        role: 'tab',
        id: 'tab-' + def.id,
        'aria-selected': String(selected),
        'aria-controls': 'blade',
        tabindex: selected ? '0' : '-1',
        onclick: function () { selectTab(def.id, false); }
      }, def.label);
      if (def.count != null) btn.append(el('small', { text: String(def.count) }));
      tabsEl.append(btn);
    });
    mainEl.setAttribute('aria-labelledby', 'tab-' + activeTab);
  }

  function selectTab(id, focus) {
    if (id !== activeTab) {
      activeTab = id;
      renderTabs();
      renderBlade();
    }
    if (focus) {
      var btn = $('#tab-' + id);
      if (btn) btn.focus();
    }
  }

  function onTabKey(e) {
    if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].indexOf(e.key) < 0) return;
    var tabs = Array.prototype.slice.call(tabsEl.querySelectorAll('[role="tab"]'));
    var index = tabs.indexOf(document.activeElement);
    if (index < 0) return;
    e.preventDefault();
    var next;
    if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = tabs.length - 1;
    else next = (index + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
    var id = tabs[next].id.replace('tab-', '');
    activeTab = id;
    renderTabs();
    renderBlade();
    var target = $('#tab-' + id);
    if (target) target.focus();
  }

  function renderBlade() {
    mainEl.textContent = '';
    mainEl.append(activeTab === 'info' ? renderInfo() : renderGames());
  }

  function caseEl(g) {
    var art = el('span', { class: 'case-art' });
    art.style.setProperty('--h', String(hueOf(g.title)));
    if (g.cover) {
      var img = el('img', { class: 'case-img', src: g.cover, alt: '', loading: 'lazy', decoding: 'async' });
      img.addEventListener('error', function () {
        img.remove();
        art.append(el('span', { class: 'case-title', text: g.title, dir: 'auto' }));
      });
      art.append(img);
    } else {
      art.append(el('span', { class: 'case-title', text: g.title, dir: 'auto' }));
    }
    return el('span', { class: 'case' },
      el('span', { class: 'case-band' }, el('span', { text: 'ELF32' }), el('span', { text: 'XBOX 360' })),
      art);
  }

  function renderTile(g) {
    var meta = [g.version ? 'v' + g.version : '', g.size, fmtDate(g.added)].filter(Boolean).join(' · ');
    return el('button', {
      class: 'tile',
      type: 'button',
      onclick: function () { openSheet(g); }
    },
      el('span', { class: 'tile-case' },
        caseEl(g),
        isNew(g) ? el('span', { class: 'badge', text: 'new' }) : null),
      el('span', { class: 'tile-name', text: g.title, dir: 'auto' }),
      meta ? el('span', { class: 'tile-meta', text: meta }) : null);
  }

  function visibleGames() {
    var needle = normalize(query.trim());
    var list = games.filter(function (g) {
      if (!needle) return true;
      return normalize([g.title, g.desc, g.author, g.tags.join(' ')].join(' ')).indexOf(needle) >= 0;
    });
    var collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
    list.sort(function (a, b) {
      if (sortMode === 'az') return collator.compare(a.title, b.title);
      if (sortMode === 'smallest') return (a.bytes || 0) - (b.bytes || 0);
      if (sortMode === 'largest') return (b.bytes || 0) - (a.bytes || 0);
      return (parseDate(b.added) ? parseDate(b.added).getTime() : 0) - (parseDate(a.added) ? parseDate(a.added).getTime() : 0) || collator.compare(a.title, b.title);
    });
    return list;
  }

  function updateGrid(grid, count) {
    var list = visibleGames();
    grid.textContent = '';
    if (!list.length) {
      count.textContent = 'No ports match \u201c' + query.trim() + '\u201d.';
      grid.append(el('p', { class: 'empty' },
        el('b', { text: 'Nothing found' }),
        'Try a different search, or clear the box to see every port.'));
      return;
    }
    list.forEach(function (g) { grid.append(renderTile(g)); });
    count.textContent = query.trim() ? list.length + ' of ' + games.length + ' ports' : '';
  }

  function renderGames() {
    var panel = el('section', { class: 'panel' },
      el('div', { class: 'panel-head' },
        el('span', { text: 'games' }),
        el('span', { text: plural(games.length, 'port') })));

    if (!games.length) {
      panel.append(el('div', { class: 'empty' },
        el('b', { text: 'No games yet' }),
        'Check back soon.'));
      return panel;
    }

    var grid = el('div', { class: 'grid', id: 'grid' });
    var count = el('p', { class: 'results-count', id: 'results-count', 'aria-live': 'polite' });

    var input = el('input', {
      type: 'search', id: 'q', placeholder: 'Search ports\u2026', 'aria-label': 'Search ports',
      autocomplete: 'off', spellcheck: 'false', value: query
    });
    input.addEventListener('input', function () {
      query = input.value;
      updateGrid(grid, count);
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && input.value) {
        e.stopPropagation();
        input.value = '';
        query = '';
        updateGrid(grid, count);
      }
    });

    var select = el('select', { id: 'sort', 'aria-label': 'Sort games' });
    [['newest', 'Newest'], ['az', 'A\u2013Z'], ['smallest', 'Smallest'], ['largest', 'Largest']].forEach(function (pair) {
      select.append(el('option', { value: pair[0], text: pair[1] }));
    });
    select.value = sortMode;
    select.addEventListener('change', function () {
      sortMode = select.value;
      updateGrid(grid, count);
    });

    panel.append(
      el('div', { class: 'toolbar' },
        el('label', { class: 'search' },
          el('span', { class: 'search-ico', 'aria-hidden': 'true', html: ICON_SEARCH }),
          input),
        el('label', { class: 'sortwrap' }, el('span', { text: 'sort' }), select)),
      count,
      grid);

    updateGrid(grid, count);
    return panel;
  }

  function infoCard(title, body) {
    return el('div', {}, el('h3', { text: title }), body);
  }

  function renderInfo() {
    var panel = el('section', { class: 'panel' },
      el('div', { class: 'panel-head' },
        el('span', { text: 'about' }),
        el('span', { text: 'read me' })));
    panel.append(el('div', { class: 'info' },
      infoCard('What is this?',
        el('p', {}, 'A small, read-only library of unofficial Xbox 360 homebrew ports. Each download is a ZIP containing an ELF32 build for a homebrew-enabled console.')),
      infoCard('How to install',
        el('ol', {},
          el('li', { text: 'Download the game and unzip it on your computer.' }),
          el('li', { text: 'Copy the .elf32 file to your Xbox 360 over USB or network.' }),
          el('li', { text: 'Launch it with your usual homebrew loader.' }))),
      infoCard('Compatibility',
        el('p', {}, 'These builds target the Xbox 360 PowerPC (Xenon) platform. They are meant for homebrew-enabled consoles; emulator support can vary. Back up your saves before trying a new build.')),
      infoCard('Credits & legal',
        el('p', {}, 'Every port is unofficial and shared for preservation. The original games and cover art belong to their creators \u2014 please support them. Not affiliated with Microsoft, Xbox, or the original developers. ',
          el('a', { href: REPO, target: '_blank', rel: 'noopener noreferrer', text: 'Source on GitHub' })))));
    return panel;
  }

  function removeSheet() {
    var sheet = $('#sheet');
    if (sheet) sheet.remove();
    root.classList.remove('no-scroll');
    sheetGame = null;
  }

  function openSheet(g) {
    if (sheetGame && sheetGame.id === g.id) return;
    lastFocus = document.activeElement;
    removeSheet();
    sheetGame = g;

    var titleId = 'sheet-title';
    var chips = el('ul', { class: 'chips' },
      el('li', { class: 'g', text: 'ELF32' }),
      el('li', { text: 'Xbox 360' }));
    if (g.size) chips.append(el('li', { text: g.size }));
    if (g.added) chips.append(el('li', { text: 'Added ' + fmtDate(g.added) }));
    g.tags.forEach(function (tag) { chips.append(el('li', { text: tag })); });

    var actions = el('div', { class: 'actions' },
      el('a', { class: 'btn btn-a', href: g.url, download: '', rel: 'noopener' },
        pad('a', 'A'), 'Download'));

    actions.append(el('button', {
      class: 'btn plain', type: 'button',
      onclick: function () {
        copyText(absUrl(g.url)).then(function (ok) {
          toast(ok ? 'Download link copied' : 'Could not copy the link. Open it in a new tab instead.');
        });
      }
    }, pad('x', 'X'), 'Copy link'));

    if (navigator.share) {
      actions.append(el('button', {
        class: 'btn plain', type: 'button',
        onclick: function () {
          navigator.share({ title: g.title, text: g.desc, url: absUrl(g.url) }).catch(function () {});
        }
      }, pad('y', 'Y'), 'Share'));
    }

    var details = el('details', { class: 'checks' },
      el('summary', { text: 'File details' }),
      el('dl', {},
        el('dt', { text: 'File' }), el('dd', {}, el('code', { text: fileName(g.url) })),
        el('dt', { text: 'Size' }), el('dd', { text: (g.size || 'Unknown') + (g.bytes ? ' (' + g.bytes.toLocaleString() + ' bytes)' : '') }),
        g.sha256 ? el('dt', { text: 'SHA-256' }) : null,
        g.sha256 ? el('dd', {}, el('code', { text: g.sha256 })) : null,
        el('dt', { text: 'Added' }), el('dd', { text: fmtDate(g.added) || '\u2014' })));

    var closeBtn = el('button', { class: 'sheet-x', type: 'button', 'aria-label': 'Close details', onclick: closeSheet }, '\u00d7');
    var sheet = el('div', { class: 'sheet', id: 'sheet' },
      el('div', { class: 'sheet-back', 'aria-hidden': 'true', onclick: closeSheet }),
      el('div', { class: 'sheet-card', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': titleId },
        closeBtn,
        el('div', { class: 'sheet-body' },
          caseEl(g),
          el('div', { class: 'sheet-info' },
            el('h2', { id: titleId, text: g.title, dir: 'auto' }),
            g.author ? el('p', { class: 'origin', text: 'Original game by ' + g.author }) : null,
            chips,
            g.desc ? el('p', { class: 'desc', text: g.desc, dir: 'auto' }) : null,
            actions,
            details))));

    sheet.addEventListener('keydown', trapFocus);
    app.append(sheet);
    root.classList.add('no-scroll');
    if (location.hash !== '#/game/' + encodeURIComponent(g.id)) {
      history.replaceState(null, '', '#/game/' + encodeURIComponent(g.id));
    }
    closeBtn.focus();
  }

  function closeSheet() {
    if (!sheetGame) return;
    removeSheet();
    if (lastFocus && typeof lastFocus.focus === 'function') {
      try { lastFocus.focus(); } catch (err) { /* ignore */ }
    }
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  }

  function trapFocus(e) {
    if (e.key !== 'Tab') return;
    var card = e.currentTarget;
    var items = Array.prototype.slice.call(card.querySelectorAll(
      'a[href], button:not([disabled]), summary, input, select, textarea, [tabindex]:not([tabindex="-1"])'
    )).filter(function (node) { return node.offsetParent !== null || node === document.activeElement; });
    if (!items.length) return;
    var first = items[0];
    var last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  }

  function syncHash() {
    var m = /^#\/?game\/(.+)$/.exec(location.hash);
    var game = null;
    if (m) {
      try {
        var id = decodeURIComponent(m[1]);
        game = games.filter(function (g) { return g.id === id; })[0] || null;
      } catch (err) { game = null; }
    }
    if (game) openSheet(game);
    else closeSheet();
  }

  function onGlobalKey(e) {
    if (e.key === 'Escape' && sheetGame) {
      closeSheet();
      return;
    }
    if (e.key === '/' && !sheetGame) {
      var tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      var input = $('#q');
      if (input) {
        e.preventDefault();
        input.focus();
        input.select();
      }
    }
  }

  buildShell();
}());
</script>
</body>
